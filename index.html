<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxfront Global Sync Platform</title>
    <style>
        :root {
            --primary-color: #0A2540;
            --secondary-color: #635BFF;
            --accent-color: #00D4B2;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
            --alert-color: #FF5A5F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #EEEEEE;
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        .user-badge {
            background: #E8E7FF;
            color: var(--secondary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .time-inputs {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        input[type="time"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="time"]:focus {
            border-color: var(--secondary-color);
        }

        .btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #4B43D3;
        }

        .reminder-banner {
            background-color: #E8E7FF;
            color: var(--secondary-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            border: 1px dashed var(--secondary-color);
            display: none;
        }

        .reminder-banner.active {
            background-color: #FFEBEB;
            color: var(--alert-color);
            border-color: var(--alert-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .results-section {
            background: #F4F5F7;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .results-section h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
            font-size: 16px;
        }

        .zone-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #E0E0E0;
        }

        .zone-card:last-child {
            border-bottom: none;
        }

        .zone-name {
            font-weight: 500;
        }

        .zone-time {
            font-weight: 700;
            color: var(--secondary-color);
            font-size: 18px;
        }

        .rollover {
            font-size: 12px;
            color: var(--alert-color);
            font-weight: bold;
            margin-left: 5px;
        }

        /* Authentication Interface Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 30px;
        }

        .modal-card {
            background: white;
            width: 100%;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-card h2 {
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .modal-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .modal-card input, .modal-card select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #E0E0E0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .modal-card input:focus, .modal-card select:focus {
            border-color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Registration Form View -->
        <div id="authModal" class="modal-overlay">
            <div class="modal-card">
                <h2>Staff Identity Registration</h2>
                <p>Configure your account settings to authorize system tone responses and desktop sync alerts.</p>
                <input type="email" id="staffEmail" placeholder="Enter Staff Email (e.g., name@maxfront.com)" required>
                <input type="tel" id="staffPhone" placeholder="Enter Phone Number" required>
                <select id="authProvider">
                    <option value="Enterprise Portal">Sign up with Maxfront ID</option>
                    <option value="Google Workspace">Sign up with Google Workspace</option>
                    <option value="Apple Enterprise">Sign up with Apple Identity</option>
                </select>
                <button class="btn" style="width: 100%;" onclick="registerStaff()">Authorize Account</button>
            </div>
        </div>

        <header>
            <div id="userBadge" class="user-badge">Initializing Token...</div>
            <h1>Maxfront Global Sync Platform</h1>
            <p>Enterprise Core Communication Node</p>
        </header>

        <div class="input-group">
            <label for="lagosTime">Schedule Local Meeting Node (Nigeria WAT):</label>
            <div class="time-inputs">
                <input type="time" id="lagosTime">
                <button class="btn" onclick="handleTimeChange()">Deploy Tracker</button>
            </div>
        </div>

        <div id="reminderBanner" class="reminder-banner">
            Awaiting session deployment...
        </div>

        <div class="results-section">
            <h3 id="resultTitle">Global Sync Times</h3>
            <div id="outputContainer">
                <!-- Data streams populate here dynamically -->
            </div>
        </div>
    </div>

    <script>
        let trackingInterval = null;
        let alertTriggered = false;

        // Sound Synthesis Generation
        function playNotificationTone() {
            try {
                const context = new (window.AudioContext || window.webkitAudioContext)();
                
                let osc1 = context.createOscillator();
                let gain1 = context.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(587.33, context.currentTime); 
                gain1.gain.setValueAtTime(0.2, context.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.4);
                osc1.connect(gain1);
                gain1.connect(context.destination);
                osc1.start();
                osc1.stop(context.currentTime + 0.4);

                setTimeout(() => {
                    let osc2 = context.createOscillator();
                    let gain2 = context.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(880.00, context.currentTime); 
                    gain2.gain.setValueAtTime(0.2, context.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.6);
                    osc2.connect(gain2);
                    gain2.connect(context.destination);
                    osc2.start();
                    osc2.stop(context.currentTime + 0.6);
                }, 120);
            } catch(e) {
                console.error("Audio system initialized with constraint:", e);
            }
        }

        // Form Registration Processing
        function registerStaff() {
            const email = document.getElementById('staffEmail').value;
            const phone = document.getElementById('staffPhone').value;
            const provider = document.getElementById('authProvider').value;

            if(!email || !phone) {
                alert("Please fully satisfy identity parameters.");
                return;
            }
return;}localStorage.setItem('staff_email', email);localStorage.setItem('staff_provider', provider);if (window.Notification && Notification.permission !== "granted") {Notification.requestPermission();}document.getElementById('authModal').style.display = 'none';loadActiveSession();}// Checks if a staff member is already logged infunction loadActiveSession() {const activeUser = localStorage.getItem('staff_email');const activeProvider = localStorage.getItem('staff_provider');if (activeUser) {document.getElementById('authModal').style.display = 'none';document.getElementById('userBadge').innerText = 👤 ${activeUser} (${activeProvider});} else {document.getElementById('userBadge').innerText = "❌ Session Unauthorized";}}// Calculates global times for Maxfront regionsfunction syncTimes() {const timeInput = document.getElementById('lagosTime').value;if (!timeInput) return;const [hoursStr, minutesStr] = timeInput.split(':');const lagosHour = parseInt(hoursStr, 10);document.getElementById('resultTitle').innerText = Global Sync Matrix for ${timeInput} WAT;const regions = [{ name: "🌍 Kuala Lumpur Hub (MYT)", offset: 7 },{ name: "🌍 Dili Core Hub (TLT)", offset: 8 }];const outputContainer = document.getElementById('outputContainer');outputContainer.innerHTML = '';regions.forEach(region => {let rawHour = lagosHour + region.offset;let convertedHour = rawHour % 24;let formattedHour = convertedHour.toString().padStart(2, '0');let dayStatus = rawHour >= 24 ? '(Next Day)' : '';const zoneCard = document.createElement('div');zoneCard.className = 'zone-card';zoneCard.innerHTML = <span class="zone-name">${region.name}</span> <span class="zone-time">${formattedHour}:${minutesStr} ${dayStatus}</span>;outputContainer.appendChild(zoneCard);});}// Monitering loop for the 15-minute countdown alertfunction checkMeetingCountdown() {const timeInput = document.getElementById('lagosTime').value;if (!timeInput) return;const [targetHours, targetMinutes] = timeInput.split(':').map(Number);const now = new Date();const targetTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), targetHours, targetMinutes, 0);if (targetTime < now) {targetTime.setDate(targetTime.getDate() + 1);}const diffMs = targetTime - now;const diffMins = Math.floor(diffMs / 1000 / 60);const diffSecs = Math.floor((diffMs / 1000) % 60);const banner = document.getElementById('reminderBanner');banner.style.display = 'block';if (diffMins > 15) {banner.classList.remove('active');banner.innerText = ⏳ Monitor Active: Synchronization cycles execute in ${diffMins}m ${diffSecs}s.;} else if (diffMins <= 15 && diffMins >= 0) {banner.classList.add('active');banner.innerText = 🚨 ALERT DELTA: Sync initialization executes in ${diffMins}m ${diffSecs}s!;if (!alertTriggered) {alertTriggered = true;playNotificationTone();if (window.Notification && Notification.permission === "granted") {new Notification("Maxfront System Alert", {body: "Operational synchronization meeting starts in exactly 15 minutes! Standby.",requireInteraction: true});}}} else {banner.classList.remove('active');banner.innerText = 🏁 The scheduled operational baseline has reached.;clearInterval(trackingInterval);}}function handleTimeChange() {alertTriggered = false;syncTimes();if (trackingInterval) clearInterval(trackingInterval);checkMeetingCountdown();trackingInterval = setInterval(checkMeetingCountdown, 1000);}window.onload = function() {loadActiveSession();const now = new Date();const hours = now.getHours().toString().padStart(2, '0');const minutes = now.getMinutes().toString().padStart(2, '0');document.getElementById('lagosTime').value = ${hours}:${minutes};syncTimes();};
